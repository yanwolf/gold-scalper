<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>黃金分價量表</title>
<style>
  :root{
    --bg: #0a0e17;
    --panel: #0f1420;
    --grid: #1c2436;
    --text: #e8ecf4;
    --muted: #6b7690;
    --resistance: #e34c4c;
    --resistance-dim: #e34c4c33;
    --support: #34d399;
    --support-dim: #34d39933;
    --gold: #d4af37;
    --gold-glow: #d4af3755;
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    padding: 16px;
  }
  .mono{ font-family: 'JetBrains Mono', 'SF Mono', 'Courier New', monospace; font-variant-numeric: tabular-nums; }

  header{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 18px; flex-wrap: wrap; gap: 10px;
  }
  .title{ display:flex; align-items:baseline; gap:10px; }
  .title h1{ font-size: 20px; font-weight: 700; letter-spacing: 0.5px; }
  .title .sub{ color: var(--muted); font-size: 12px; }
  .live-dot{
    width:7px; height:7px; border-radius:50%; background: var(--support);
    display:inline-block; box-shadow: 0 0 8px var(--support);
    animation: pulse 1.6s ease-in-out infinite;
  }
  .live-dot.off{ background:#e34c4c; box-shadow:0 0 8px #e34c4c; animation:none; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.35;} }

  .price-now{ text-align:right; }
  .price-now .val{ font-size: 26px; font-weight: 700; }
  .price-now .lbl{ font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }

  .controls{ display:flex; gap:8px; flex-wrap: wrap; margin-bottom: 16px; }
  .controls select{
    background: var(--panel); border: 1px solid var(--grid); color: var(--text);
    padding: 7px 10px; border-radius: 6px; font-size: 13px;
  }

  .panel{
    background: var(--panel); border: 1px solid var(--grid); border-radius: 10px;
    padding: 18px; margin-bottom: 16px;
  }

  .stat-row{ display:flex; gap: 22px; margin-bottom: 18px; flex-wrap: wrap; }
  .stat .lbl{ font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 3px; }
  .stat .val{ font-size: 16px; font-weight: 700; }
  .stat.poc .val{ color: var(--gold); }

  .chart{ display:flex; flex-direction: column; gap: 3px; }
  .row{
    display:grid; grid-template-columns: 1fr 92px; align-items:center; gap: 10px;
    height: 26px; position: relative;
  }
  .bar-track{ height: 100%; position: relative; display:flex; align-items:center; }
  .bar{
    height: 78%; border-radius: 3px; position: relative;
    display:flex; align-items:center; padding: 0 8px;
    transition: width 0.4s ease; min-width: 2px;
  }
  .bar.resistance{ background: linear-gradient(90deg, var(--resistance-dim), var(--resistance)); }
  .bar.support{ background: linear-gradient(90deg, var(--support-dim), var(--support)); }
  .bar .pct{ font-size: 10px; font-weight: 700; color: #0a0e17; white-space: nowrap; }
  .row.is-poc{ outline: 1px solid var(--gold); border-radius: 4px; box-shadow: 0 0 12px var(--gold-glow); }
  .row.is-poc .price-label{ color: var(--gold); font-weight: 700; }
  .price-label{ font-size: 12px; text-align:right; color: var(--text); }

  .current-line{ position: absolute; left:0; right:0; height:0; border-top: 1px dashed var(--gold); pointer-events: none; }
  .current-line .tag{
    position:absolute; right: 96px; top: -9px;
    background: var(--gold); color:#1a1200; font-size:10px; font-weight:700;
    padding: 1px 6px; border-radius: 3px;
  }

  .empty, .error{ color: var(--muted); font-size: 13px; padding: 30px; text-align:center; }
  .error{ color: var(--resistance); }

  footer{ color: var(--muted); font-size: 11px; text-align:center; margin-top: 10px; }
</style>
</head>
<body>

<header>
  <div class="title">
    <span class="live-dot off" id="liveDot"></span>
    <div>
      <h1>GOLD 分價量表</h1>
      <div class="sub">資料源：Binance XAUUSDT 逐筆成交</div>
    </div>
  </div>
  <div class="price-now">
    <div class="val mono" id="currentPrice">--</div>
    <div class="lbl">最新報價</div>
  </div>
</header>

<div class="controls">
  <select id="bucketSize">
    <option value="0.5">箱寬 0.5</option>
    <option value="1" selected>箱寬 1.0</option>
    <option value="2">箱寬 2.0</option>
  </select>
  <select id="tradeLimit">
    <option value="1000">近1000筆</option>
    <option value="3000" selected>近3000筆</option>
    <option value="6000">近6000筆</option>
  </select>
</div>

<div class="panel">
  <div class="stat-row">
    <div class="stat poc">
      <div class="lbl">POC 最大量價位</div>
      <div class="val mono" id="statPoc">--</div>
    </div>
    <div class="stat">
      <div class="lbl">Value Area 高</div>
      <div class="val mono" id="statVAH">--</div>
    </div>
    <div class="stat">
      <div class="lbl">Value Area 低</div>
      <div class="val mono" id="statVAL">--</div>
    </div>
    <div class="stat">
      <div class="lbl">取樣成交筆數</div>
      <div class="val mono" id="statCount">--</div>
    </div>
  </div>

  <div class="chart" id="chart">
    <div class="empty">載入中...</div>
  </div>
</div>

<footer id="statusLine">尚未連線</footer>

<script>
const els = {
  bucketSize: document.getElementById('bucketSize'),
  tradeLimit: document.getElementById('tradeLimit'),
  chart: document.getElementById('chart'),
  liveDot: document.getElementById('liveDot'),
  currentPrice: document.getElementById('currentPrice'),
  statPoc: document.getElementById('statPoc'),
  statVAH: document.getElementById('statVAH'),
  statVAL: document.getElementById('statVAL'),
  statCount: document.getElementById('statCount'),
  statusLine: document.getElementById('statusLine'),
};

let pollTimer = null;

function setStatus(msg, isError){
  els.statusLine.textContent = msg;
  els.statusLine.style.color = isError ? 'var(--resistance)' : 'var(--muted)';
}

function setLive(on){
  els.liveDot.classList.toggle('off', !on);
}

function renderError(msg){
  setLive(false);
  els.chart.innerHTML = `<div class="error">${msg}</div>`;
}

function renderProfile(data, currentPrice){
  const profile = data.profile || [];
  if(profile.length === 0){
    els.chart.innerHTML = '<div class="empty">目前還沒有足夠的成交資料，稍等資料累積後再試</div>';
    return;
  }

  els.statPoc.textContent = data.poc != null ? data.poc.toFixed(2) : '--';
  els.statVAH.textContent = data.value_area_high != null ? data.value_area_high.toFixed(2) : '--';
  els.statVAL.textContent = data.value_area_low != null ? data.value_area_low.toFixed(2) : '--';
  els.statCount.textContent = data.trade_count != null ? data.trade_count.toLocaleString() : '--';

  const maxPct = Math.max(...profile.map(p => p.pct_of_max), 1);
  const sorted = [...profile].sort((a,b) => b.price_level - a.price_level);

  let currentLineInserted = false;
  const rows = [];

  sorted.forEach(row => {
    const isResistance = currentPrice != null ? row.price_level > currentPrice : true;
    const isPoc = row.price_level === data.poc;
    const widthPct = Math.max((row.pct_of_max / maxPct) * 100, 2);

    if(currentPrice != null && !currentLineInserted && row.price_level < currentPrice){
      rows.push(`<div class="current-line"><span class="tag mono">${currentPrice.toFixed(2)}</span></div>`);
      currentLineInserted = true;
    }

    rows.push(`
      <div class="row ${isPoc ? 'is-poc' : ''}">
        <div class="bar-track">
          <div class="bar ${isResistance ? 'resistance' : 'support'}" style="width:${widthPct}%">
            <span class="pct">${row.pct_of_max.toFixed(1)}%</span>
          </div>
        </div>
        <div class="price-label mono">${row.price_level.toFixed(2)}</div>
      </div>
    `);
  });

  els.chart.innerHTML = rows.join('');
}

async function fetchAndRender(){
  const bucketSize = els.bucketSize.value;
  const tradeLimit = els.tradeLimit.value;

  try{
    // 相對路徑，因為這個頁面現在跟API是同一個服務、同一個網域，不用再貼網址
    const [profileRes, priceRes] = await Promise.all([
      fetch(`/analysis/volume-profile?bucket_size=${bucketSize}&trade_limit=${tradeLimit}`),
      fetch(`/price/latest/binance`),
    ]);

    if(!profileRes.ok) throw new Error(`分價量表API回傳錯誤 (${profileRes.status})`);
    const profileData = await profileRes.json();

    let currentPrice = null;
    if(priceRes.ok){
      const priceData = await priceRes.json();
      if(priceData && priceData.bid && priceData.ask){
        currentPrice = (parseFloat(priceData.bid) + parseFloat(priceData.ask)) / 2;
        els.currentPrice.textContent = currentPrice.toFixed(2);
      }
    }

    renderProfile(profileData, currentPrice);
    setLive(true);
    setStatus(`上次更新：${new Date().toLocaleTimeString('zh-TW')}`);
  }catch(err){
    renderError(`載入失敗：${err.message}`);
    setStatus('載入失敗，請確認後端服務是否正常運作', true);
  }
}

function startPolling(){
  if(pollTimer) clearInterval(pollTimer);
  fetchAndRender();
  pollTimer = setInterval(fetchAndRender, 10000);
}

els.bucketSize.addEventListener('change', fetchAndRender);
els.tradeLimit.addEventListener('change', fetchAndRender);

startPolling();
</script>

</body>
</html>
